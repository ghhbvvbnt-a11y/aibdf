name: Unzip project
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip files
        run: |
          zipfile=$(ls *.zip | head -n 1)
          unzip -o "$zipfile" -d tmp_unzip
          shopt -s dotglob
          if [ "$(ls tmp_unzip | wc -l)" = "1" ] && [ -d tmp_unzip/* ]; then
            cp -r tmp_unzip/*/* .
          else
            cp -r tmp_unzip/* .
          fi
          rm -rf tmp_unzip "$zipfile"
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project" || exit 0
          git push
